name: Deploy Landing Page

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve latest release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Snapshot the latest release so the page never depends on a
          # browser-side API call, which is rate limited per visitor IP.
          gh api "repos/${{ github.repository }}/releases/latest" > docs/release.json \
            || echo '{}' > docs/release.json
          python3 -c "import json;d=json.load(open('docs/release.json'));print('release:',d.get('tag_name'),[a['name'] for a in d.get('assets',[])])"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
